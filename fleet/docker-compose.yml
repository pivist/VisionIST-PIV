name: visionist-fleet

# Local-build fleet: every service is built from its box's own directory
# (../images/<box> using docker/Dockerfile) and run under a local tag — no
# ghcr pull required. Use `docker compose build --parallel` to produce all 8
# from source, `docker compose up -d` to start.
#
#   cd fleet
#   docker compose build --parallel   # ~10–30 min; vggt (5 GB weights) is the long pole
#   docker compose up -d
#   docker compose ps                 # watch them come up
#   python hello.py                   # reach every box with one generic pattern
#   docker compose down
#
# Every box listens on 8061 internally; we map them to host ports 9061–9071.
# GPU: each service reserves all nvidia devices. For a CPU-only host, drop the
# `<<: *gpu` merge from every service.

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:

  clip:
    <<: *gpu
    build: { context: ../images/clip,          dockerfile: docker/Dockerfile }
    image: visionist-local/clip
    container_name: visionist-clip
    ports: ["9061:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped

  textembedding:
    <<: *gpu
    build: { context: ../images/textEmbedding, dockerfile: docker/Dockerfile }
    image: visionist-local/textembedding
    container_name: visionist-textembedding
    ports: ["9062:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped

  tapnext:
    <<: *gpu
    build: { context: ../images/tapnext_tracker, dockerfile: docker/Dockerfile }
    image: visionist-local/tapnext
    container_name: visionist-tapnext
    ports: ["9063:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped

  lang_sam:
    <<: *gpu
    build: { context: ../images/lang_segm,     dockerfile: docker/Dockerfile }
    image: visionist-local/lang_sam
    container_name: visionist-lang_sam
    ports: ["9064:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped

  opencv:
    <<: *gpu
    build: { context: ../images/opencv_box,    dockerfile: docker/Dockerfile }
    image: visionist-local/opencv
    container_name: visionist-opencv
    ports: ["9065:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped

  # Heaviest build in the fleet: the Dockerfile clones facebookresearch/vggt
  # and downloads the VGGT-1B checkpoint (~5 GB) at build time.
  vggt:
    <<: *gpu
    build: { context: ../images/vggt,          dockerfile: docker/Dockerfile }
    image: visionist-local/vggt
    container_name: visionist-vggt
    ports: ["9066:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped

  # MoGe-3 — CUDA-only box (it rejects CPU inference).
  moge:
    <<: *gpu
    build: { context: ../images/moge_box,      dockerfile: docker/Dockerfile }
    image: visionist-local/moge
    container_name: visionist-moge
    ports: ["9067:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped

  yolo:
    <<: *gpu
    build: { context: ../images/yolo,          dockerfile: docker/Dockerfile }
    image: visionist-local/yolo
    container_name: visionist-yolo
    ports: ["9068:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped

  lightglue:
    <<: *gpu
    build: { context: ../images/lightglue_box, dockerfile: docker/Dockerfile }
    image: visionist-local/lightglue
    container_name: visionist-lightglue
    ports: ["9069:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped

  # UniMatch — dense optical flow / stereo disparity / metric depth.
  # Ships the flow checkpoint; stereo/depth checkpoints via parameters.model.
  unimatch:
    <<: *gpu
    build: { context: ../images/unimatch,      dockerfile: docker/Dockerfile }
    image: visionist-local/unimatch
    container_name: visionist-unimatch
    ports: ["9070:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped

  # features — SIFT keypoint extraction (port of the pivist/features CLI).
  # Pure CPU: no `<<: *gpu` merge, nothing to reserve.
  features:
    build: { context: ../images/features_box,  dockerfile: docker/Dockerfile }
    image: visionist-local/features
    container_name: visionist-features
    ports: ["9071:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped

  # =========================================================================
  # visionist-webui — the browser front-end over the boxes (SPA at / + /api/*)
  # Runs on the same compose network, so it reaches boxes by SERVICE NAME on
  # box port 8061 (see ../webui/data-docker/fleet.json). No GPU needed.
  # =========================================================================
  webui:
    build: { context: ..,   dockerfile: webui/Dockerfile }
    image: visionist-local/webui
    container_name: visionist-webui
    ports: ["8080:8000"]                    # optional host access; DockTail uses the container IP
    environment:
      - WEBUI_HOST=0.0.0.0
      - WEBUI_PORT=8000
      - WEBUI_DATA_DIR=/data
    volumes:
      - ../webui/data-docker:/data          # fleet.json (service-name addrs) + probe state
    depends_on:
      - clip
      - textembedding
      - tapnext
      - lang_sam
      - vggt
      - moge
      - yolo
      - unimatch
      - features
    restart: unless-stopped
    labels:
      # ---- DockTail: advertise this container as a Tailscale service --------
      - "docktail.service.enable=true"
      - "docktail.service.name=webui"
      - "docktail.service.description=VisionIST WebUI"
      - "docktail.service.port=8000"                 # backend (in-container) port
      - "docktail.service.protocol=http"             # backend speaks plain HTTP
      - "docktail.service.service-port=443"          # tailnet-facing port
      - "docktail.service.service-protocol=https"    # HTTPS with Tailscale auto-TLS
      - "docktail.service.network=visionist-fleet_default"
    # Access (once advertised): https://webui.<your-tailnet>.ts.net/

  # =========================================================================
  # docktail — advertises docktail-labeled containers as native Tailscale services
  # Host setup (Linux): mounts the host docker + tailscale sockets. With
  # TAILSCALE_OAUTH_CLIENT_ID/SECRET it auto-creates the Service definition; without
  # them it still advertises locally (manual mode: create/approve the Service and
  # set ACL autoApprovers so tag:server may advertise tag:container services).
  # =========================================================================
  docktail:
    image: ghcr.io/marvinvr/docktail:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/tailscale:/var/run/tailscale
    environment:
      - TAILSCALE_OAUTH_CLIENT_ID=${TAILSCALE_OAUTH_CLIENT_ID:-}
      - TAILSCALE_OAUTH_CLIENT_SECRET=${TAILSCALE_OAUTH_CLIENT_SECRET:-}
      - DEFAULT_SERVICE_TAGS=tag:service-host   # the node's tag (dash, not underscore)
    depends_on:
      - webui
